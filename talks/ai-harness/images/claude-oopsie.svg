<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'JetBrains Mono', 'Fira Code', 'Menlo', monospace">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- Minimal terminal chrome -->
  <circle cx="90" cy="70" r="14" fill="#ff5f56"/>
  <circle cx="130" cy="70" r="14" fill="#ffbd2e"/>
  <circle cx="170" cy="70" r="14" fill="#27c93f"/>

  <!-- ── User: clean up migrations ── -->
  <text x="90" y="220" font-size="54" fill="#6b6b6b">&gt;</text>
  <text x="160" y="220" font-size="54" fill="#fafafa">clean up migrations</text>

  <!-- ── Claude: Bash tool call ── -->
  <circle cx="108" cy="358" r="16" fill="#eb9b41"/>
  <text x="160" y="378" font-size="54" fill="#eb9b41" font-weight="700">Bash</text>
  <text x="310" y="378" font-size="54" fill="#d4d4d4">DROP TABLE patients;</text>

  <!-- ── User: WHAT ── -->
  <text x="90" y="530" font-size="54" fill="#6b6b6b">&gt;</text>
  <text x="160" y="530" font-size="54" fill="#fafafa" font-weight="700">WHAT</text>

  <!-- ── Claude: apology (2 lines) ── -->
  <circle cx="108" cy="668" r="16" fill="#eb9b41"/>
  <text x="160" y="688" font-size="54" fill="#fafafa">Good catch! I shouldn't</text>
  <text x="160" y="770" font-size="54" fill="#fafafa">have deleted your database.</text>

  <!-- ── New prompt with blinking cursor ── -->
  <text x="90" y="920" font-size="54" fill="#6b6b6b">&gt;</text>
  <rect x="160" y="884" width="28" height="52" fill="#eb9b41">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
