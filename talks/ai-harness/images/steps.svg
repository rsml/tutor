<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .step-num  { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif; font-size: 52px; font-weight: 700; fill: #fafafa; text-anchor: middle; dominant-baseline: central; }
      .step-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 42px; fill: #fafafa; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!--
    Circles centered at x=260 (so text at x=400 is comfortably to the right of circle edge at 260+60=320).
    Circle radius: 60px (diameter 120px).
    Step centers: y=200, 480, 760 (280px apart).
    Dashed connectors between circle edges:
      1→2: y=260 to y=420
      2→3: y=540 to y=700
  -->

  <!-- Step 1: y=200 -->
  <circle cx="260" cy="200" r="60" fill="none" stroke="#fafafa" stroke-width="3"/>
  <text x="260" y="200" class="step-num">1</text>
  <text x="400" y="200" class="step-text">Your riskiest AI code path</text>

  <!-- Connector 1 → 2 -->
  <line x1="260" y1="263" x2="260" y2="417" stroke="#3f3f46" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Step 2: y=480 -->
  <circle cx="260" cy="480" r="60" fill="none" stroke="#fafafa" stroke-width="3"/>
  <text x="260" y="480" class="step-num">2</text>
  <text x="400" y="480" class="step-text">Make the safety property a type</text>

  <!-- Connector 2 → 3 -->
  <line x1="260" y1="543" x2="260" y2="697" stroke="#3f3f46" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Step 3: y=760 -->
  <circle cx="260" cy="760" r="60" fill="none" stroke="#fafafa" stroke-width="3"/>
  <text x="260" y="760" class="step-num">3</text>
  <text x="400" y="760" class="step-text">Make its absence a build failure</text>

</svg>
