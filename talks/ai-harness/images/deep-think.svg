<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- 5 expert perspectives arranged in a gestalt circle -->
  <!-- No pentagon drawn; positions suggest the shape -->

  <!-- Top: Security -->
  <text x="960" y="210" font-size="64" font-weight="600" fill="#fafafa" text-anchor="middle">Security</text>

  <!-- Upper-right: Performance -->
  <text x="1470" y="560" font-size="64" font-weight="600" fill="#fafafa" text-anchor="middle">Performance</text>

  <!-- Lower-right: Maintainability -->
  <text x="1310" y="910" font-size="64" font-weight="600" fill="#fafafa" text-anchor="middle">Maintainability</text>

  <!-- Lower-left: Compliance -->
  <text x="610" y="910" font-size="64" font-weight="600" fill="#fafafa" text-anchor="middle">Compliance</text>

  <!-- Upper-left: User Experience -->
  <text x="450" y="560" font-size="64" font-weight="600" fill="#fafafa" text-anchor="middle">User Experience</text>
</svg>
