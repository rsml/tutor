<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .node-box { rx: 8; }
      .label-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 26px; fill: #fafafa; font-weight: 600; text-anchor: middle; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; fill: #a1a1aa; text-anchor: middle; }
      .level-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #52525b; text-anchor: middle; letter-spacing: 2px; text-transform: uppercase; }
      .error-text { font-family: 'SF Mono', Consolas, monospace; font-size: 13px; fill: #fca5a5; }
      .ghost-line { stroke: #fafafa; stroke-width: 1.5; stroke-dasharray: 6,4; opacity: 0.12; }
      .main-line { stroke: #fafafa; stroke-width: 2.5; opacity: 0.9; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fafafa" opacity="0.9"/>
    </marker>
    <marker id="arrowhead-ghost" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fafafa" opacity="0.12"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- Column headers (faint) -->
  <text x="760" y="60" class="level-label">Belief</text>
  <text x="760" y="310" class="level-label">Rule</text>
  <text x="760" y="560" class="level-label">Code Gate</text>
  <text x="760" y="810" class="level-label">Proof</text>

  <!-- Subtle horizontal separator lines -->
  <line x1="200" y1="240" x2="1720" y2="240" stroke="#27272a" stroke-width="1"/>
  <line x1="200" y1="490" x2="1720" y2="490" stroke="#27272a" stroke-width="1"/>
  <line x1="200" y1="740" x2="1720" y2="740" stroke="#27272a" stroke-width="1"/>

  <!-- ===== MAIN HIGHLIGHTED PATH (center column) ===== -->

  <!-- Node 1: Belief -->
  <rect x="500" y="80" width="520" height="110" rx="10" fill="#18181b" stroke="#fafafa" stroke-width="2" opacity="1"/>
  <text x="760" y="128" class="label-main">Patient harm is the worst outcome</text>
  <text x="760" y="160" class="label-sub">Core belief</text>

  <!-- Arrow 1→2 -->
  <line x1="760" y1="190" x2="760" y2="328" class="main-line" marker-end="url(#arrowhead)"/>

  <!-- Node 2: Rule -->
  <rect x="530" y="330" width="460" height="110" rx="10" fill="#18181b" stroke="#fafafa" stroke-width="2" opacity="1"/>
  <text x="760" y="378" class="label-main">PHI has one home</text>
  <text x="760" y="410" class="label-sub">Policy: POLICY-PHI</text>

  <!-- Arrow 2→3 -->
  <line x1="760" y1="440" x2="760" y2="578" class="main-line" marker-end="url(#arrowhead)"/>

  <!-- Node 3: Code Gate -->
  <rect x="490" y="580" width="540" height="110" rx="10" fill="#18181b" stroke="#fafafa" stroke-width="2" opacity="1"/>
  <text x="760" y="628" class="label-main">Audit or don't compile</text>
  <text x="760" y="660" class="label-sub">Effect Layer enforcement</text>

  <!-- Arrow 3→4 -->
  <line x1="760" y1="690" x2="760" y2="828" class="main-line" marker-end="url(#arrowhead)"/>

  <!-- Node 4: Proof — compiler error box -->
  <rect x="440" y="830" width="640" height="140" rx="6" fill="#0f0f0f" stroke="#ef4444" stroke-width="2"/>
  <!-- Terminal-style header bar -->
  <rect x="440" y="830" width="640" height="28" rx="6" fill="#1a0000"/>
  <circle cx="462" cy="844" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="482" cy="844" r="6" fill="#fbbf24" opacity="0.5"/>
  <circle cx="502" cy="844" r="6" fill="#22c55e" opacity="0.3"/>
  <text x="760" y="847" font-family="-apple-system, sans-serif" font-size="12" fill="#71717a" text-anchor="middle">tsc — build error</text>
  <!-- Error output -->
  <text x="460" y="878" class="error-text">error TS2345: Argument of type 'PHIContext'</text>
  <text x="460" y="898" class="error-text">  is not assignable to parameter of type 'AuditedPHIContext'.</text>
  <text x="460" y="918" class="error-text">  Property 'auditTrail' is missing in type 'PHIContext'.</text>
  <text x="460" y="938" class="error-text">    at src/api/handlers/patient.ts<tspan fill="#71717a">:31:18</tspan></text>
  <text x="460" y="958" class="error-text" fill="#fca5a5">Found <tspan fill="#ef4444" font-weight="bold">1</tspan> error. Build failed.</text>

  <!-- ===== GHOST PATHS (faded, branching structure) ===== -->

  <!-- Ghost path left: from Node 1 -->
  <line x1="500" y1="135" x2="290" y2="350" stroke="#fafafa" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.12" marker-end="url(#arrowhead-ghost)"/>
  <!-- Ghost node left rule -->
  <rect x="130" y="340" width="300" height="80" rx="8" fill="#18181b" stroke="#fafafa" stroke-width="1" opacity="0.12"/>
  <text x="280" y="376" font-family="-apple-system, sans-serif" font-size="18" fill="#fafafa" text-anchor="middle" opacity="0.12">No magic strings</text>
  <text x="280" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#a1a1aa" text-anchor="middle" opacity="0.12">POLICY-NOMAGIC</text>
  <!-- Ghost arrow from left rule to gate -->
  <line x1="280" y1="420" x2="400" y2="590" stroke="#fafafa" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.12" marker-end="url(#arrowhead-ghost)"/>
  <!-- Ghost left code gate -->
  <rect x="200" y="590" width="280" height="70" rx="8" fill="#18181b" stroke="#fafafa" stroke-width="1" opacity="0.12"/>
  <text x="340" y="630" font-family="-apple-system, sans-serif" font-size="17" fill="#fafafa" text-anchor="middle" opacity="0.12">Enum-only constants</text>

  <!-- Ghost path right: from Node 1 -->
  <line x1="1020" y1="135" x2="1220" y2="350" stroke="#fafafa" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.12" marker-end="url(#arrowhead-ghost)"/>
  <!-- Ghost node right rule -->
  <rect x="1110" y="340" width="320" height="80" rx="8" fill="#18181b" stroke="#fafafa" stroke-width="1" opacity="0.12"/>
  <text x="1270" y="376" font-family="-apple-system, sans-serif" font-size="18" fill="#fafafa" text-anchor="middle" opacity="0.12">Typed errors only</text>
  <text x="1270" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#a1a1aa" text-anchor="middle" opacity="0.12">POLICY-TYPED-ERRORS</text>
  <!-- Ghost arrow from right rule to gate -->
  <line x1="1270" y1="420" x2="1120" y2="590" stroke="#fafafa" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.12" marker-end="url(#arrowhead-ghost)"/>
  <!-- Ghost right code gate -->
  <rect x="1040" y="590" width="260" height="70" rx="8" fill="#18181b" stroke="#fafafa" stroke-width="1" opacity="0.12"/>
  <text x="1170" y="630" font-family="-apple-system, sans-serif" font-size="17" fill="#fafafa" text-anchor="middle" opacity="0.12">Effect return types</text>

  <!-- Ghost path far right: from Node 2 -->
  <line x1="990" y1="385" x2="1340" y2="610" stroke="#fafafa" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.09" marker-end="url(#arrowhead-ghost)"/>
  <!-- Ghost far right gate -->
  <rect x="1330" y="590" width="300" height="70" rx="8" fill="#18181b" stroke="#fafafa" stroke-width="1" opacity="0.09"/>
  <text x="1480" y="630" font-family="-apple-system, sans-serif" font-size="17" fill="#fafafa" text-anchor="middle" opacity="0.09">Route middleware order</text>

</svg>
