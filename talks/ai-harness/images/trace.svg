<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .tier-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 30px; fill: #888888; font-weight: 600; text-anchor: middle; letter-spacing: 3px; text-transform: uppercase; }
      .tier-label-red { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 30px; fill: #ef4444; font-weight: 600; text-anchor: middle; letter-spacing: 3px; text-transform: uppercase; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 42px; fill: #fafafa; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .node-text-red { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 42px; fill: #ef4444; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- === Node 1: AXIOM === -->
  <!-- y range: label at 62, box 80–180 -->
  <text x="960" y="62" class="tier-label">Axiom</text>
  <rect x="510" y="80" width="900" height="100" rx="12" fill="#222222" stroke="#444444" stroke-width="2"/>
  <text x="960" y="130" class="node-text">Patient harm is the worst outcome</text>

  <!-- Arrow 1 → 2: line from y=180 to y=256, triangle tip at y=280 -->
  <line x1="960" y1="180" x2="960" y2="256" stroke="#555555" stroke-width="4"/>
  <polygon points="940,256 980,256 960,280" fill="#555555"/>

  <!-- === Node 2: PRINCIPLE === -->
  <!-- label at 310, box 328–428 -->
  <text x="960" y="310" class="tier-label">Principle</text>
  <rect x="510" y="328" width="900" height="100" rx="12" fill="#222222" stroke="#444444" stroke-width="2"/>
  <text x="960" y="378" class="node-text">PHI access is always audited</text>

  <!-- Arrow 2 → 3 -->
  <line x1="960" y1="428" x2="960" y2="504" stroke="#555555" stroke-width="4"/>
  <polygon points="940,504 980,504 960,528" fill="#555555"/>

  <!-- === Node 3: POLICY === -->
  <!-- label at 558, box 576–676 -->
  <text x="960" y="558" class="tier-label">Policy</text>
  <rect x="510" y="576" width="900" height="100" rx="12" fill="#222222" stroke="#444444" stroke-width="2"/>
  <text x="960" y="626" class="node-text">If audit fails, suppress PHI</text>

  <!-- Arrow 3 → 4 -->
  <line x1="960" y1="676" x2="960" y2="752" stroke="#555555" stroke-width="4"/>
  <polygon points="940,752 980,752 960,776" fill="#555555"/>

  <!-- === Node 4: ENFORCEMENT === -->
  <!-- label at 806, box 824–924 -->
  <text x="960" y="806" class="tier-label-red">Enforcement</text>
  <rect x="510" y="824" width="900" height="100" rx="12" fill="#1a0000" stroke="#ef4444" stroke-width="3"/>
  <text x="960" y="874" class="node-text-red">Compiler error: AuditSink is missing</text>

</svg>
