<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; fill: #a1a1aa; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- Icon 1: Chat bubble (Prompts) — x=360 -->
  <g transform="translate(360, 480)">
    <!-- Chat bubble body -->
    <path d="M-70,-60 Q-70,-90 -40,-90 L40,-90 Q70,-90 70,-60 L70,10 Q70,40 40,40 L10,40 L0,65 L-10,40 L-40,40 Q-70,40 -70,10 Z" fill="none" stroke="#d4d4d8" stroke-width="5" stroke-linejoin="round"/>
    <!-- Chat lines -->
    <line x1="-40" y1="-55" x2="40" y2="-55" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-40" y1="-28" x2="20" y2="-28" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-40" y1="-1" x2="30" y2="-1" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <!-- Red X strike -->
    <line x1="-90" y1="-100" x2="90" y2="90" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <line x1="90" y1="-100" x2="-90" y2="90" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="360" y="640" class="label">Prompts</text>

  <!-- Icon 2: Document (Documentation) — x=760 -->
  <g transform="translate(760, 480)">
    <!-- Document body -->
    <path d="M-50,-90 L30,-90 L30,-55 L65,-55 L65,90 L-50,90 Z" fill="none" stroke="#d4d4d8" stroke-width="5" stroke-linejoin="round"/>
    <!-- Folded corner -->
    <path d="M30,-90 L65,-55 L30,-55 Z" fill="none" stroke="#d4d4d8" stroke-width="5" stroke-linejoin="round"/>
    <!-- Document lines -->
    <line x1="-30" y1="-20" x2="40" y2="-20" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-30" y1="10" x2="40" y2="10" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-30" y1="40" x2="15" y2="40" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round"/>
    <!-- Red X strike -->
    <line x1="-90" y1="-110" x2="90" y2="110" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <line x1="90" y1="-110" x2="-90" y2="110" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="760" y="640" class="label">Documentation</text>

  <!-- Icon 3: Code review comment — x=1160 -->
  <g transform="translate(1160, 480)">
    <!-- Code window -->
    <rect x="-75" y="-95" width="150" height="115" rx="8" fill="none" stroke="#d4d4d8" stroke-width="5"/>
    <!-- Window chrome dots -->
    <circle cx="-52" cy="-72" r="7" fill="#d4d4d8"/>
    <circle cx="-30" cy="-72" r="7" fill="#d4d4d8"/>
    <circle cx="-8" cy="-72" r="7" fill="#d4d4d8"/>
    <!-- Code lines -->
    <line x1="-52" y1="-45" x2="20" y2="-45" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-52" y1="-20" x2="40" y2="-20" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-52" y1="5" x2="-5" y2="5" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round"/>
    <!-- Comment bubble -->
    <path d="M0,30 L75,30 L75,85 L20,85 L10,100 L5,85 L0,85 Z" fill="none" stroke="#d4d4d8" stroke-width="4" stroke-linejoin="round"/>
    <line x1="15" y1="48" x2="60" y2="48" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="66" x2="50" y2="66" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/>
    <!-- Red X strike -->
    <line x1="-100" y1="-115" x2="110" y2="120" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <line x1="110" y1="-115" x2="-100" y2="120" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="1160" y="640" class="label">Code Review</text>

  <!-- Icon 4: Compiler/Terminal — x=1560, green circle -->
  <g transform="translate(1560, 480)">
    <!-- Green circle highlight -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#22c55e" stroke-width="8"/>
    <!-- Terminal window -->
    <rect x="-70" y="-80" width="140" height="100" rx="8" fill="none" stroke="#d4d4d8" stroke-width="5"/>
    <!-- Terminal chrome bar -->
    <rect x="-70" y="-80" width="140" height="26" rx="8" fill="#d4d4d8" opacity="0.2"/>
    <!-- Terminal prompt lines -->
    <text x="-55" y="-38" font-family="'SF Mono', Consolas, monospace" font-size="18" fill="#22c55e">$</text>
    <line x1="-35" y1="-42" x2="45" y2="-42" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="-55" y1="-15" x2="20" y2="-15" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <!-- Error output line -->
    <line x1="-55" y1="10" x2="55" y2="10" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Gear/cog below terminal suggesting compiler -->
    <circle cx="0" cy="50" r="22" fill="none" stroke="#d4d4d8" stroke-width="4"/>
    <circle cx="0" cy="50" r="10" fill="none" stroke="#d4d4d8" stroke-width="3"/>
    <!-- Gear teeth (8 teeth) -->
    <line x1="0" y1="22" x2="0" y2="15" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="78" x2="0" y2="85" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-28" y1="50" x2="-35" y2="50" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="28" y1="50" x2="35" y2="50" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="30" x2="-25" y2="25" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="25" y2="75" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="20" y1="30" x2="25" y2="25" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="70" x2="-25" y2="75" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="1560" y="640" class="label" style="fill: #22c55e;">Compiler</text>

</svg>
