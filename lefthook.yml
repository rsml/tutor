# Mirrors the checks in .github/workflows/ci.yml. Keep this file in sync
# with that workflow whenever the CI steps change.
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint --max-warnings 0 {staged_files}
    typecheck:
      run: pnpm typecheck

pre-push:
  commands:
    test:
      run: pnpm test
